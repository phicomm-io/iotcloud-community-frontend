<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__MODEL__ 设备设置</title><style>__STYLE__
body{max-width:760px}.stack>*+*{margin-top:16px}.fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}.grid{grid-template-columns:minmax(0,1fr)}.banner{overflow-wrap:anywhere}button{touch-action:manipulation}@media(max-width:600px){body{padding:16px 16px 48px}.card{padding:16px}}
</style><script>__APPEARANCE__</script></head><body>
<header class="topbar"><div class="brand"><div><span class="kind">Phicomm Community · 精简版</span><h1>__MODEL__ 设备设置</h1></div></div><div class="prefs"><select id="theme" aria-label="外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div></header>
<p id="message" class="banner info" role="status" aria-live="polite">正在读取设备状态…</p>
<section class="card stack"><h2>连接状态</h2><p id="status" class="help">尚未确认连接</p><button type="button" class="btn" id="refresh">刷新状态</button></section>
<form id="setup" class="stack" style="margin-top:16px">
<section id="import" class="card stack" hidden><h2>来自管理平台的 MQTT 配置</h2><p class="help">确认后填入下方表单，点击保存才会应用。</p><button type="button" class="btn" id="accept">确认填入</button></section>
<section class="card stack"><h2>MQTT 连接</h2><p class="help">配置将先保存，再切换 Wi-Fi。连接失败时仍可在本页修改。</p><div class="fields"><label class="field"><span>服务器地址</span><input id="host" maxlength="127" required></label><label class="field"><span>端口</span><input id="port" type="number" min="1" max="65535" value="1883" required></label><label class="field"><span>用户名</span><input id="user" maxlength="63" autocomplete="off"></label><label class="field"><span>密码（留空保留原密码）</span><input id="mqttPassword" type="password" maxlength="256" autocomplete="new-password"></label></div><label><input type="checkbox" id="clearMqtt"> 清除 MQTT 密码</label><label class="field" id="protocolField" hidden><span>协议</span><select id="protocol"><option value="tmcp">TMCP (v2)</option><option value="legacy">Legacy (v1)</option></select></label></section>
<section class="card stack"><h2>Wi-Fi 配网</h2><button type="button" class="btn" id="scan">扫描 Wi-Fi</button><label class="field"><span>网络名称（可手动输入）</span><input id="ssid" maxlength="32" list="networks" required autocomplete="off"><datalist id="networks"></datalist></label><label class="field"><span>密码（留空保留原密码）</span><input id="wifiPassword" type="password" maxlength="63" autocomplete="new-password"></label><label><input id="openNetwork" type="checkbox"> 开放网络，无密码</label><p class="help">设备会试连 30 秒，失败后恢复原 Wi-Fi。成功后热点可能关闭，请将手机切回同一内网。</p></section>
<section class="card stack"><h2>网页管理密码</h2><label class="field"><span>新密码（选填，留空不修改）</span><input id="adminPassword" type="password" maxlength="32" autocomplete="new-password"></label><p class="help">用户名为 admin。此密码与 MQTT 密码独立。</p></section>
<div class="form-actions"><button id="save" class="btn primary" type="submit">保存并连接</button></div>
</form><p class="help" style="margin-top:24px">完整设备控制请使用 IotCloud 管理平台。此页在设备热点及内网地址下均可访问。</p>
<script>__SERVICE__
__PROVISION__
__SETUP__</script></body></html>
