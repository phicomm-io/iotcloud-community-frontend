<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__MODEL__</title><style>__STYLE__
body{max-width:760px}.stack>*+*{margin-top:16px}.fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}.grid{grid-template-columns:minmax(0,1fr)}.banner{overflow-wrap:anywhere}button{touch-action:manipulation}@media(max-width:600px){body{padding:16px 16px 48px}.card{padding:16px}}
</style><script>__APPEARANCE__</script></head><body>
<header class="topbar"><div class="brand"><div><span class="kind" data-i18n="setup.compact"></span><h1>__MODEL__</h1></div></div><div class="prefs"><select id="language" aria-label="Language"><option value="auto">Auto</option><option value="en">English</option><option value="zh-CN">简体中文</option></select><select id="theme" data-i18n-aria="setup.appearance"><option value="system" data-i18n="setup.system"></option><option value="light" data-i18n="setup.light"></option><option value="dark" data-i18n="setup.dark"></option></select></div></header>
<p id="message" class="banner info" role="status" aria-live="polite" data-i18n="setup.loading"></p>
<section id="recovery" class="card stack" hidden><p data-i18n="recovery.hint"></p><button id="clearConfig" class="btn danger" type="button" data-i18n="recovery.clear"></button></section>
<section class="card stack"><h2 data-i18n="setup.connection"></h2><p id="status" class="help"></p><button type="button" class="btn" id="refresh" data-i18n="setup.refresh"></button></section>
<form id="setup" class="stack" style="margin-top:16px">
<section id="import" class="card stack" hidden><h2 data-i18n="setup.import"></h2><p class="help" data-i18n="setup.import_hint"></p><button type="button" class="btn" id="accept" data-i18n="setup.accept"></button></section>
<section class="card stack"><h2 data-i18n="setup.mqtt"></h2><p class="help" data-i18n="setup.order"></p><div class="fields"><label class="field"><span data-i18n="setup.host"></span><input id="host" maxlength="127" required></label><label class="field"><span data-i18n="setup.port"></span><input id="port" type="number" min="1" max="65535" value="1883" required></label><label class="field"><span data-i18n="setup.user"></span><input id="user" maxlength="63" autocomplete="off"></label><label class="field"><span data-i18n="setup.password"></span><input id="mqttPassword" type="password" maxlength="256" autocomplete="new-password"></label></div><label><input type="checkbox" id="clearMqtt"> <span data-i18n="setup.clear_mqtt"></span></label><label class="field" id="protocolField" hidden><span data-i18n="setup.protocol"></span><select id="protocol"><option value="tmcp">TMCP (v2)</option><option value="legacy">Legacy (v1)</option></select></label></section>
<section class="card stack"><h2 data-i18n="setup.wifi"></h2><button type="button" class="btn" id="scan" data-i18n="setup.scan"></button><label class="field"><span data-i18n="setup.ssid"></span><input id="ssid" maxlength="32" list="networks" required autocomplete="off"><datalist id="networks"></datalist></label><label class="field"><span data-i18n="setup.password"></span><input id="wifiPassword" type="password" maxlength="63" autocomplete="new-password"></label><label><input id="openNetwork" type="checkbox"> <span data-i18n="setup.open"></span></label><p class="help" data-i18n="setup.wifi_hint"></p></section>
<section class="card stack"><h2 data-i18n="setup.auth"></h2><label class="field"><span data-i18n="setup.new_password"></span><input id="adminPassword" type="password" maxlength="32" autocomplete="new-password"></label><p class="help" data-i18n="setup.auth_hint"></p><label class="field" id="deviceLanguageRow" hidden><span data-i18n="setup.device_language"></span><select id="deviceLanguage"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></section>
<div class="form-actions"><button id="save" class="btn primary" type="submit" data-i18n="setup.save"></button></div>
</form><p class="help" style="margin-top:24px" data-i18n="setup.platform"></p>
<script>__I18N__
__SERVICE__
__PROVISION__
__SETUP__</script></body></html>
