name: Frontend tests and release
on:
  push:
    branches: [main, dev, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch workflow
        run: python3 tools/check_branch_policy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements-build.txt
      - run: npm ci --prefix frontend
      - run: node tools/generate-hub-paho.mjs --check
        working-directory: frontend
      - run: npm test --prefix frontend
      - run: python3 tests/check_web.py
      - run: NODE_PATH=frontend/node_modules node tests/test_setup.cjs
      - run: NODE_PATH=frontend/node_modules node --test tests/test_config_recovery.cjs tests/test_device_auth.cjs tests/test_status_reload.cjs tests/test_hub_remote_pages.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_web.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_ota_policy.cjs
      - run: WEB_TEST_VIEWS=1 NODE_PATH=frontend/node_modules node tests/test_web.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_a1_light_save.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_a1_countdown.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_a1_filter.cjs
      - run: NODE_PATH=frontend/node_modules node --test tests/test_a1_i18n_fallbacks.cjs tests/test_demo_i18n.cjs
      - run: node --test frontend/tests/i18n-*.mjs
      - run: NODE_PATH=frontend/node_modules node --test tests/test_a1_filter_stock.cjs tests/test_a1_sensor_capabilities.cjs tests/test_a1_fresh_air.cjs tests/test_m1_co2_display.cjs tests/test_m1_co2_source.cjs tests/test_m1_wake_alarm.cjs tests/test_m1_thresholds.cjs tests/test_m1_music.cjs tests/test_m1_particles.cjs
      - run: NODE_PATH=frontend/node_modules node --test tests/test_m1_display_format.cjs tests/test_m1_display_profile.cjs
      - run: TZ=Asia/Shanghai NODE_PATH=frontend/node_modules node --test tests/test_m1_wake_alarm.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_a1_auto.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_daikin.cjs
      - run: NODE_PATH=frontend/node_modules node --test tests/test_ota_conversion.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_m1_pressure.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test minified device pages
        env:
          NODE_PATH: frontend/node_modules
          WEB_TEST_MINIFIED: '1'
        run: |
          node --test tests/test_config_recovery.cjs tests/test_device_auth.cjs tests/test_status_reload.cjs tests/test_hub_remote_pages.cjs
          node tests/test_web.cjs
          node tests/test_ota_policy.cjs
          node tests/test_a1_light_save.cjs
          node tests/test_a1_countdown.cjs
          node tests/test_a1_filter.cjs
          node --test tests/test_a1_filter_stock.cjs tests/test_a1_sensor_capabilities.cjs tests/test_m1_co2_display.cjs tests/test_m1_co2_source.cjs tests/test_m1_wake_alarm.cjs tests/test_m1_thresholds.cjs tests/test_m1_music.cjs tests/test_m1_particles.cjs
          node --test tests/test_m1_display_format.cjs tests/test_m1_display_profile.cjs
          node tests/test_a1_auto.cjs
          node tests/test_m1_co2.cjs
          node tests/test_daikin.cjs
          node --test tests/test_ota_conversion.cjs
          node tests/test_m1_pressure.cjs
      - run: python3 tools/build_release.py
      - run: npx --prefix frontend playwright install --with-deps chromium webkit
      - run: NODE_PATH=frontend/node_modules node tests/test_status_reload_browser.cjs
      - run: BROWSER=webkit NODE_PATH=frontend/node_modules node tests/test_status_reload_browser.cjs
      - name: Test M1 display profiles in built platform, local and hub applications
        env:
          M1_DISPLAY_BUNDLE_ROOT: ../build/bundle
        run: node tests/m1-display-built.mjs
        working-directory: frontend
      - run: npx playwright test tests/setup.spec.js tests/lan-connection.spec.js tests/local-connection.spec.js tests/device-home.spec.js
        working-directory: frontend
      - name: Test local connection entry in WebKit
        env:
          BROWSER: webkit
        run: npx playwright test tests/local-connection.spec.js
        working-directory: frontend
      - run: NODE_PATH=frontend/node_modules node tests/test_demos.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_daikin_indicators_browser.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_daikin_co2_browser.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_binding_layout.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_a1_effect_countdown_browser.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_interaction_layout.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_m1_pressure_browser.cjs
      - run: BROWSER=webkit NODE_PATH=frontend/node_modules node tests/test_m1_pressure_browser.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_m1_display_profile_browser.cjs
      - run: BROWSER=webkit NODE_PATH=frontend/node_modules node tests/test_m1_display_profile_browser.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_m1_particles_browser.cjs
      - run: BROWSER=webkit NODE_PATH=frontend/node_modules node tests/test_m1_particles_browser.cjs
      - run: BROWSER=webkit NODE_PATH=frontend/node_modules node tests/test_interaction_layout.cjs
      - run: npm run build --prefix frontend
      - run: node tests/ota-conversion.mjs
        working-directory: frontend
      - run: node tests/bemfa-cloud.mjs
        working-directory: frontend
      - run: node tests/mobile-layout.mjs
        working-directory: frontend
      - run: node tests/static-webapp.mjs
        working-directory: frontend
      - run: node tests/install-app.mjs
        working-directory: frontend
      - run: node tests/github-login.mjs
        working-directory: frontend
      - run: node tests/admin-verification.mjs
        working-directory: frontend
      - run: node tests/banner.mjs
        working-directory: frontend
      - run: node tests/provisioning.mjs
        working-directory: frontend
      - name: Build isolated hub frontend
        env:
          VITE_HUB: '1'
          VITE_BASE_PATH: /iotcloud/
        run: npm run build -- --outDir ../build/ci-hub --emptyOutDir
        working-directory: frontend
      - name: Test hub HomeKit UI and shared local device assets
        env:
          HUB_TEST_DIST: ../build/ci-hub
        run: |
          node tests/hub-home.mjs
          node --test tests/hub-device-assets.mjs
          node tests/hub-lan-management.mjs
          BROWSER=chromium node tests/hub-command-session.mjs
          BROWSER=webkit node tests/hub-command-session.mjs
        working-directory: frontend
      - name: Test standalone and local hub management entry points
        env:
          HUB_TEST_DIST: ../build/ci-hub
          CLOUD_TEST_DIST: dist
        run: node tests/hub-webui-entry.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: |
            build/frontend.tar.gz
            build/frontend.lock.json
            build/SHA256SUMS
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: frontend
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: release
      - name: Publish commit-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FRONTEND_COMMIT: ${{ github.sha }}
        run: |
          tag="frontend-$FRONTEND_COMMIT"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --dir existing
            cmp release/frontend.tar.gz existing/frontend.tar.gz
            cmp release/frontend.lock.json existing/frontend.lock.json
          else
            gh release create "$tag" --target "$FRONTEND_COMMIT" --title "Frontend $FRONTEND_COMMIT" --notes "Pinned frontend build for $FRONTEND_COMMIT. Verify SHA256SUMS before consuming." release/*
          fi
