name: Frontend tests and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: python3 tests/check_web.py
      - run: NODE_PATH=frontend/node_modules node tests/test_web.cjs
      - run: NODE_PATH=frontend/node_modules node tests/test_a1_light_save.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/build_release.py
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: NODE_PATH=frontend/node_modules node tests/test_demos.cjs
      - run: npm run build --prefix frontend
      - run: node tests/static-webapp.mjs
        working-directory: frontend
      - run: node tests/provisioning.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: |
            build/frontend.tar.gz
            build/frontend.lock.json
            build/SHA256SUMS
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: frontend
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: release
      - name: Publish commit-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FRONTEND_COMMIT: ${{ github.sha }}
        run: |
          tag="frontend-$FRONTEND_COMMIT"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --dir existing
            cmp release/frontend.tar.gz existing/frontend.tar.gz
            cmp release/frontend.lock.json existing/frontend.lock.json
          else
            gh release create "$tag" --target "$FRONTEND_COMMIT" --title "Frontend $FRONTEND_COMMIT" --notes "Pinned frontend build for $FRONTEND_COMMIT. Verify SHA256SUMS before consuming." release/*
          fi
